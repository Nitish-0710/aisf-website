<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Ambient Aura -->
    <circle cx="0" cy="0" r="90" fill="#0b1120" stroke="url(#iconBlue)" stroke-width="2" opacity="0.6"/>
    
    <!-- Scholar Cap -->
    <path d="M-55 -40 L-25 -54 L5 -40 L-25 -26 Z" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round" filter="url(#iconGlow)"/>
    <path d="M-42 -35 L-42 -20 Q-25 -14 -8 -20 L-8 -35" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M5 -40 L10 -25 L10 -15" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="10" cy="-12" r="3" fill="#38bdf8"/>

    <!-- Left Face Contour -->
    <path d="M-25 -25 C-45 -25 -58 -10 -58 10 C-58 28 -48 42 -35 52 C-38 35 -30 20 -20 15 C-28 32 -25 55 -15 62 C-32 50 -45 35 -45 10 C-45 -5 -35 -18 -22 -20" 
          fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"/>

    <!-- Right Neural Brain & Circuitry -->
    <path d="M0 -38 C15 -42 35 -35 42 -20 C48 -10 50 5 44 20 C52 28 50 48 38 56 C25 64 8 60 0 58" 
          fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" filter="url(#iconGlow)"/>
    
    <!-- Internal Circuit Traces -->
    <path d="M8 -20 L24 -20 L32 -10" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="-10" r="3.5" fill="#38bdf8"/>

    <path d="M12 -2 L28 -2 L28 12 L38 12" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="12" r="3.5" fill="#38bdf8"/>

    <path d="M8 18 L22 18 L28 28 L15 28 L15 42 L25 42" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="42" r="3.5" fill="#38bdf8"/>
  </g>
</svg>
