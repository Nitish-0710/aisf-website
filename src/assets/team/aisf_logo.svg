<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="50%" stop-color="#0084ff" />
      <stop offset="100%" stop-color="#0056cb" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon: Brain / Graduate Scholar Icon -->
  <g transform="translate(180, 115)">
    <!-- Ambient Blue Aura -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.25" filter="url(#glow)"/>
    
    <!-- Scholar Cap on left head -->
    <path d="M-55 -40 L-25 -52 L5 -40 L-25 -28 Z" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round" filter="url(#subtleGlow)"/>
    <path d="M-42 -35 L-42 -20 Q-25 -14 -8 -20 L-8 -35" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M5 -40 L10 -25 L10 -15" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="10" cy="-12" r="3" fill="#38bdf8"/>

    <!-- Left side of head / Face contour -->
    <path d="M-25 -25 C-45 -25 -58 -10 -58 10 C-58 28 -48 42 -35 52 C-38 35 -30 20 -20 15 C-28 32 -25 55 -15 62 C-32 50 -45 35 -45 10 C-45 -5 -35 -18 -22 -20" 
          fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>
    <path d="M-30 6 C-30 18 -20 28 -12 35" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Right side of head / Neural Brain Circuitry -->
    <!-- Brain outer lobe lobes -->
    <path d="M0 -38 C15 -42 35 -35 42 -20 C48 -10 50 5 44 20 C52 28 50 48 38 56 C25 64 8 60 0 58" 
          fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" filter="url(#subtleGlow)"/>
    
    <!-- Internal Brain Circuit Traces and Nodes -->
    <path d="M8 -20 L24 -20 L32 -10" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="-10" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)"/>

    <path d="M12 -2 L28 -2 L28 12 L38 12" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="12" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)"/>

    <path d="M8 18 L22 18 L28 28 L15 28 L15 42 L25 42" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="42" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)"/>

    <path d="M5 35 L10 35 L12 48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="12" cy="48" r="3" fill="#38bdf8"/>
  </g>

  <!-- Letters: AISF -->
  <!-- Letter A -->
  <g transform="translate(320, 45)">
    <!-- Scholar cap on top of A -->
    <path d="M45 -18 L80 -32 L115 -18 L80 -4 Z" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round" filter="url(#subtleGlow)"/>
    <path d="M60 -12 L60 0 Q80 8 100 0 L100 -12" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M115 -18 L122 -4 L122 8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="122" cy="10" r="3" fill="#38bdf8"/>

    <!-- Left & Right Leg of A -->
    <path d="M80 8 L18 160 L48 160 L80 80 L112 160 L142 160 Z" fill="url(#blueGrad)" filter="url(#subtleGlow)"/>
    
    <!-- Inner Crossbar with AI Chip -->
    <rect x="52" y="100" width="56" height="15" fill="url(#blueGrad)"/>
    <circle cx="80" cy="107.5" r="14" fill="#06060a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="80" cy="107.5" r="7" fill="#38bdf8"/>
    <!-- Chip pins -->
    <path d="M66 107.5 L73 107.5 M87 107.5 L94 107.5 M80 93.5 L80 100.5 M80 114.5 L80 121.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Letter I with Gears -->
  <g transform="translate(485, 45)">
    <!-- Gears above I -->
    <g transform="translate(32, -16)">
      <!-- Gear 1 -->
      <g transform="translate(-10, -5)">
        <circle cx="0" cy="0" r="11" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#subtleGlow)"/>
        <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
        <path d="M0 -14 L0 -10 M0 10 L0 14 M-14 0 L-10 0 M10 0 L14 0 M-10 -10 L-7 -7 M7 7 L10 10 M-10 10 L-7 7 M7 -7 L10 -10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Gear 2 (smaller) -->
      <g transform="translate(10, -18)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)"/>
        <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
        <path d="M0 -11 L0 -8 M0 8 L0 11 M-11 0 L-8 0 M8 0 L11 0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Main Pillar of I -->
    <rect x="18" y="10" width="28" height="150" rx="4" fill="url(#blueGrad)" filter="url(#subtleGlow)"/>
  </g>

  <!-- Letter S (Circuit Style) -->
  <g transform="translate(565, 45)">
    <!-- Outer Track -->
    <path d="M125 24 L32 24 C14 24 0 38 0 56 C0 74 14 88 32 88 L96 88 C114 88 128 102 128 120 C128 138 114 152 96 152 L12 152" 
          fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>
    
    <!-- Circuit Pin Node inside S -->
    <circle cx="112" cy="24" r="6" fill="#06060a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="25" cy="115" r="8" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="25" cy="115" r="3" fill="#38bdf8"/>
    <circle cx="20" cy="152" r="5" fill="#06060a" stroke="#38bdf8" stroke-width="2.5"/>
  </g>

  <!-- Letter F (Circuit Style) -->
  <g transform="translate(710, 45)">
    <!-- Vertical Stem -->
    <path d="M22 10 L22 160" fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linecap="round" filter="url(#subtleGlow)"/>
    
    <!-- Top Horizontal Bar -->
    <path d="M22 22 L115 22" fill="none" stroke="url(#blueGrad)" stroke-width="22" stroke-linecap="round" filter="url(#subtleGlow)"/>
    
    <!-- Middle Horizontal Bar -->
    <path d="M22 82 L90 82" fill="none" stroke="url(#blueGrad)" stroke-width="20" stroke-linecap="round" filter="url(#subtleGlow)"/>

    <!-- Circuit details -->
    <circle cx="105" cy="22" r="5" fill="#06060a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="80" cy="82" r="5" fill="#06060a" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Subtitle: ARTIFICIAL INTELLIGENCE STUDENT FORUM -->
  <g transform="translate(500, 248)">
    <text text-anchor="middle" font-family="'JetBrains Mono', 'Inter', monospace, sans-serif" font-size="25" font-weight="700" letter-spacing="4" fill="#ffffff">
      ARTIFICIAL INTELLIGENCE <tspan fill="#38bdf8" filter="url(#subtleGlow)">STUDENT FORUM</tspan>
    </text>
  </g>
</svg>
